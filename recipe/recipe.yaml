context:
  name: zae-limiter
  version: "0.13.0"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/z/${{ name }}/zae_limiter-${{ version }}.tar.gz
  sha256: 05bec0abef882a85a76beaa68e578f5823355c9a1cb2867ecad40d96558be023

build:
  noarch: python
  script: python -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
    - hatch-vcs
    - hatch-build-scripts >=1
    - ruff >=0.9.0
  run:
    - python >=${{ python_min }}
    - aiobotocore >=2.13.0
    - aws_lambda_builders >=1.40.0
    - boto3 >=1.34.0
    - click >=8.0.0
    - docker-py >=7.0.0
    - pip
    - python-ulid >=3.0.0
    - pyyaml >=6.0
    - questionary >=2.0

tests:
  - python:
      imports:
        - zae_limiter
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - script:
      - zae-limiter --help
      - zae-limiter lambda-export --output lambda.zip
      - python -c "from zae_limiter import __version__; assert __version__ == '${{ version }}', f'Expected ${{ version }}, got {__version__}'"
    requirements:
      run:
        - pip

about:
  homepage: https://github.com/zeroae/zae-limiter
  summary: Rate limiting library backed by DynamoDB with token bucket algorithm
  license: MIT
  license_file: LICENSE
  documentation: https://zeroae.github.io/zae-limiter/
  repository: https://github.com/zeroae/zae-limiter

extra:
  recipe-maintainers:
    - sodre
    - mrohr
